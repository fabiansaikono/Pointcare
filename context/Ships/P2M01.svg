    <ellipse cx="6" cy="45" rx="7" ry="7" fill="url(#engineGlow)" filter="url(#softGlow)"/>
    <ellipse cx="6" cy="64" rx="8" ry="8" fill="url(#engineGlow)" filter="url(#softGlow)"/>
    <ellipse cx="6" cy="83" rx="7" ry="7" fill="url(#engineGlow)" filter="url(#softGlow)"/>

    <!-- exact shared mothership body: nose RIGHT, engines LEFT -->
