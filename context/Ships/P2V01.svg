<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="P2V01 vessel sprite without visible hull text">
  <title>P2V01 vessel sprite — no visible text</title>
  <desc>Flat 2D side-view compact dark industrial vessel sprite with transparent background, nose left, rear engines right, plain central label plate, and no laser.</desc>

  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3e40"/>
      <stop offset="0.45" stop-color="#232628"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="darkHull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303335"/>
      <stop offset="1" stop-color="#111315"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#505356"/>
      <stop offset="1" stop-color="#17191b"/>
    </linearGradient>
    <radialGradient id="engineGlow" cx="0.45" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#eaf8ff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#7fd8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#148dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="laserGlow" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#fff9a8" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffd000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .outline{stroke:#050608;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
      .panel{stroke:#07090a;stroke-width:.75;stroke-linejoin:round;fill:none;opacity:.82}
      .fine{stroke:#777b7f;stroke-width:.45;stroke-linecap:round;opacity:.28;fill:none}
      .bolt{fill:#090a0b;stroke:#55585a;stroke-width:.25;opacity:.85}
      .light{fill:#f7a51b;stroke:#2b1400;stroke-width:.35}
      .deep{fill:#08090a;stroke:#242628;stroke-width:.6}
      .scratch{stroke:#86898b;stroke-width:.38;stroke-linecap:round;opacity:.25}
    ]]></style>
  </defs>
  <g id="P2V01-ship" shape-rendering="geometricPrecision">
    <!-- rear engine glow on the RIGHT -->
    <ellipse cx="121" cy="55" rx="7" ry="7" fill="url(#engineGlow)" filter="url(#softGlow)"/>
    <ellipse cx="121" cy="73" rx="7" ry="7" fill="url(#engineGlow)" filter="url(#softGlow)"/>

    <!-- compact vessel body: nose LEFT, engines RIGHT -->
    <path class="outline" fill="url(#hull)" d="M7 64 L17 47 L34 40 H91 L107 47 L118 58 V70 L107 81 L91 88 H34 L17 81 Z"/>
    <path class="outline" fill="#111416" d="M8 64 L19 49 L29 45 L23 55 L23 73 L29 83 L19 79 Z"/>
    <path fill="#263033" stroke="#08090a" stroke-width=".8" d="M13 58 L19 52 L22 56 V62 H14 Z M13 66 H22 V72 L19 76 L13 70 Z"/>
    <path class="outline" fill="url(#darkHull)" d="M109 50 H119 V61 H109 Z M109 67 H119 V78 H109 Z"/>
    <rect x="118" y="53" width="6" height="5" rx="2" fill="#58cfff" opacity=".95"/>
    <rect x="118" y="70" width="6" height="5" rx="2" fill="#58cfff" opacity=".95"/>
    <path class="fine" d="M110 54 H118 M110 58 H118 M110 71 H118 M110 75 H118"/>

    <!-- central armor plate: no white vertical stripes -->
