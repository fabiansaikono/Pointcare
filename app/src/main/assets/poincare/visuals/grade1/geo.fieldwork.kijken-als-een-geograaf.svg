<text x="395" y="194" fill="#FFD700" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600"><tspan x="395" dy="0">Zo werkt het</tspan></text>
<text x="395" y="235" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400"><tspan x="395" dy="0">Geografen stellen waar-, wat- en</tspan><tspan x="395" dy="31">waaromvragen en leggen waarnemingen</tspan><tspan x="395" dy="31">vast.</tspan></text>
<text x="395" y="356" fill="#FFD700" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600"><tspan x="395" dy="0">Voorbeeld</tspan></text>
