<text x="40" y="54" fill="#FFD700" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600"><tspan x="40" dy="0">Kijken als een geograaf</tspan></text>
<text x="66" y="212" fill="#FFD700" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600"><tspan x="66" dy="0">1. waarnemen</tspan></text>
